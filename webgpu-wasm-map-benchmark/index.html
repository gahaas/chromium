<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>wasm to webgpu upload benchmark</title>

      body {
        background: black;
        color: white;
      }
      #cvs {

        border-radius: 6px;

        display: block;
      }
      /* tweakpane */

  </head>

    <div id="panediv"></div>
    <canvas id="cvs"></canvas>
    <textarea readonly id=log cols=60 rows=14></textarea>
  </body>
</html>
